[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yuppie-lark"
version = "0.4.1"
description = "Lark/Feishu OpenAPI client library (tenant_access_token auth)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "yuppie", email = "yidaowanli@gmail.com" }
]
keywords = ["lark", "feishu", "openapi", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yuppie1949/yuppie-mcp-lark"
Repository = "https://github.com/yuppie1949/yuppie-mcp-lark"

[tool.hatch.build.targets.wheel]
packages = ["src/yuppie_lark"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyproject.toml",
]
