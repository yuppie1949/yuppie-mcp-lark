[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
yuppie-lark = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "packages/yuppie-lark/src:packages/yuppie-mcp-lark/src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
